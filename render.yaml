services:
  - type: web
    name: iran-opportunity-ecosystem
    runtime: node
    plan: free
    buildCommand: npm install -g pnpm && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
